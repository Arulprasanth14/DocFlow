services:
  # ============================================================
  # PostgreSQL 16 + pgvector + pg_trgm
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: docflow
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # PgBouncer — Connection Pooler (transaction mode)
  # ============================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: docflow-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: docflow
      DB_PASSWORD: docflow
      DB_HOST: postgres
      DB_NAME: docflow
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # Redis 7.2 — Cache + Pub/Sub + Celery Broker
  # ============================================================
  redis:
    image: redis:7.2-alpine
    container_name: docflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # MinIO — S3-compatible local file storage
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: docflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialiser (runs once, creates all buckets)
  minio-init:
    image: minio/mc:latest
    container_name: docflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/docflow-documents;
      mc mb --ignore-existing local/docflow-previews;
      mc mb --ignore-existing local/docflow-exports;
      mc mb --ignore-existing local/docflow-ocr-input;
      mc mb --ignore-existing local/docflow-templates;
      echo 'Buckets created successfully';
      "
    restart: "no"

  # ============================================================
  # Mailpit — SMTP trap with web UI (dev email testing)
  # ============================================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: docflow-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      MP_MAX_MESSAGES: 500

  # ============================================================
  # Adminer — Lightweight DB GUI
  # ============================================================
  adminer:
    image: adminer:latest
    container_name: docflow-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  # ============================================================
  # FastAPI Backend (dev — with hot reload)
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: docflow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://docflow:docflow@pgbouncer:5432/docflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      APP_ENV: development
      APP_DEBUG: "true"
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - ./.env:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================================
  # Celery Worker
  # ============================================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: docflow-celery-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://docflow:docflow@pgbouncer:5432/docflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      MINIO_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./app:/app/app
      - ./.env:/app/.env
    depends_on:
      - postgres
      - redis
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q default,ai,email

  # ============================================================
  # Celery Beat — Scheduler (SLA checks, cleanup)
  # ============================================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: docflow-celery-beat
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://docflow:docflow@pgbouncer:5432/docflow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./app:/app/app
      - ./.env:/app/.env
    depends_on:
      - redis
    command: celery -A app.core.celery_app beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ============================================================
  # Flower — Celery monitoring UI
  # ============================================================
  flower:
    image: mher/flower:latest
    container_name: docflow-flower
    restart: unless-stopped
    ports:
      - "5555:5555"
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: docflow-network
